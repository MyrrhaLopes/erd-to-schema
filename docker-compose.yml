# Dev: `pnpm infra:up` sobe só o Postgres e o Mailpit.
# Produção local: `pnpm prod:local` sobe as imagens reais (as mesmas do Railway) + Postgres + Mailpit.
# Escala (fase 7): `pnpm prod:scale` sobe também o Redis e uma segunda réplica do `server`;
# o Caddy distribui /api e /collab entre as duas.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: erd
      POSTGRES_PASSWORD: erd
      POSTGRES_DB: erd
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erd"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  server: &server
    profiles: [prod]
    image: erd-server
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NATIVE_TOOLCHAIN: ${NATIVE_TOOLCHAIN:-1}
    # no Railway as migrações rodam no preDeployCommand; aqui, antes de subir
    command: ["sh", "-c", "node dist/migrate.js && exec node --no-node-snapshot --enable-source-maps dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_URL: http://localhost:8081
      BETTER_AUTH_URL: http://localhost:8081
      DATABASE_URL: postgres://erd:erd@postgres:5432/erd_prod
      BETTER_AUTH_SECRET: prod-local-secret-prod-local-secret-xx
      COLLAB_JWT_SECRET: prod-local-collab-prod-local-collab-xx
      MAIL_DRIVER: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: ERD Builder <noreply@localhost>
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: 30
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # o e2e cria várias contas por minuto do mesmo IP (em produção, o padrão é 5)
      AUTH_SIGNUPS_PER_MINUTE: ${AUTH_SIGNUPS_PER_MINUTE:-5}
      # vazio = uma réplica só, sem Redis
      REDIS_URL: ${REDIS_URL:-}
      # o E2E usa o Drive em memória (DRIVE_PROVIDER=fake); vazio = sem Drive
      DRIVE_PROVIDER: ${DRIVE_PROVIDER:-}
    depends_on:
      postgres: { condition: service_healthy }
      createdb: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 40
    stop_grace_period: 35s

  # fase 7: segunda réplica (mesma imagem), só com o perfil `scale`; espera a primeira para não
  # rodarem as migrações ao mesmo tempo
  server2:
    <<: *server
    profiles: [scale]
    build: !reset null
    depends_on:
      server: { condition: service_healthy }
      redis: { condition: service_healthy }

  redis:
    profiles: [scale]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  # banco separado do de dev para o prod:local
  createdb:
    profiles: [prod]
    image: postgres:16
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["sh", "-c", "psql postgres://erd:erd@postgres:5432/erd -tc \"select 1 from pg_database where datname='erd_prod'\" | grep -q 1 || psql postgres://erd:erd@postgres:5432/erd -c 'create database erd_prod'"]
    restart: "no"

  web:
    profiles: [prod]
    image: erd-web
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      PORT: 8080
      # com o perfil `scale`, as duas réplicas (o Caddy reparte as requisições e os WebSockets)
      SERVER_INTERNAL_URL: ${SERVER_UPSTREAMS:-http://server:8080}
    ports: ["8081:8080"]
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
